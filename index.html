<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>チュロス判定カメラ</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; color: #fff; overflow: hidden;
    font-family: system-ui, -apple-system, "Hiragino Sans", sans-serif;
    -webkit-user-select: none; user-select: none; }
  #video { position: absolute; left: 0; top: 0; width: 2px; height: 2px; opacity: 0; pointer-events: none; }
  #view { position: absolute; inset: 0; width: 100%; height: 100%; }
  button { font: inherit; border: 0; cursor: pointer; color: #fff; }
  .chip { background: rgba(0,0,0,.55); padding: 8px 14px; border-radius: 999px; font-size: 14px; }
  .chip.on { background: #7fd4ff; color: #002233; }

  #top { position: absolute; top: 12px; left: 12px; right: 12px; display: none;
    justify-content: space-between; align-items: flex-start; gap: 8px; z-index: 10; }
  #stats { font-size: 12px; line-height: 1.6; background: rgba(0,0,0,.55);
    padding: 6px 10px; border-radius: 10px; font-variant-numeric: tabular-nums; white-space: pre; }
  #topBtns { display: flex; flex-direction: column; gap: 8px; align-items: flex-end; }

  #result { position: absolute; left: 12px; right: 12px; bottom: 112px; display: none;
    background: rgba(0,0,0,.6); border-radius: 16px; padding: 12px 16px; z-index: 10; }
  #verdict { font-size: 26px; font-weight: 800; letter-spacing: .02em; }
  #verdict.yes { color: #ffcf6e; }
  #verdict.no { color: #bbb; }
  .bar { position: relative; height: 10px; background: #444; border-radius: 5px; margin: 8px 0 4px; overflow: hidden; }
  .bar > div { height: 100%; background: #ffcf6e; width: 0; transition: width .12s linear; }
  #thMark { position: absolute; top: -2px; bottom: -2px; width: 2px; background: #fff; }
  #scoreText { font-size: 13px; color: #ddd; display: flex; justify-content: space-between; }
  #thRow { font-size: 13px; color: #ddd; display: flex; align-items: center; gap: 8px; margin-top: 6px; }
  #thRow input { flex: 1; }

  #bottom { position: absolute; bottom: 28px; left: 0; right: 0; display: none;
    justify-content: space-around; align-items: center; z-index: 10; }
  .round { width: 54px; height: 54px; border-radius: 50%; background: rgba(0,0,0,.55);
    font-size: 22px; display: flex; align-items: center; justify-content: center; }
  #pauseBtn { width: 70px; height: 70px; border-radius: 50%; background: #fff; color: #002233;
    font-size: 15px; font-weight: 700; box-shadow: 0 0 0 5px rgba(255,255,255,.35); }

  #start { position: absolute; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 16px; padding: 24px;
    text-align: center; line-height: 1.7; background: #111; z-index: 20; }
  .primary { background: #7fd4ff; color: #002233; font-weight: 700;
    padding: 14px 28px; border-radius: 999px; font-size: 17px; }
  #startMsg { color: #ffb37f; white-space: pre-wrap; }
</style>
<!-- ONNX Runtime Web（MobileNetV3 用）。WebGPU が使えない端末では自動で CPU(wasm) を使う -->
<script src="https://cdn.jsdelivr.net/npm/onnxruntime-web@1.20.1/dist/ort.webgpu.min.js"></script>
</head>
<body>
<video id="video" playsinline muted autoplay></video>
<canvas id="view"></canvas>

<div id="top">
  <div id="stats"></div>
  <div id="topBtns">
    <button class="chip on" id="modelBtn">モデル</button>
    <button class="chip" id="devBtn">実行: 自動</button>
  </div>
</div>

<div id="result">
  <div id="verdict">…</div>
  <div class="bar"><div id="scoreBar"></div><span id="thMark"></span></div>
  <div id="scoreText"><span id="scoreNum">チュロスらしさ –</span><span>枠の中を判定</span></div>
  <div id="thRow">判定の基準 <input id="th" type="range" min="0.3" max="0.95" step="0.05" value="0.7"> <b id="thv">0.70</b></div>
</div>

<div id="bottom">
  <span class="round" style="visibility:hidden"></span>
  <button id="pauseBtn">停止</button>
  <button class="round" id="flipBtn" aria-label="カメラ切替">⟲</button>
</div>

<div id="start">
  <div><b style="font-size:20px">チュロス判定カメラ</b></div>
  <div>カメラに映ったものがチュロスかどうかを<br>端末の中だけでリアルタイムに判定します。<br>（映像はどこにも送信されません）</div>
  <button class="primary" id="startBtn">カメラを起動</button>
  <div id="startMsg"></div>
</div>

<script type="module">
const MP_VER = '0.10.14';
const SIZE = 224;
const LABELS = ['churros', 'other'];
const MODELS = [
  { name: 'MobileNetV3-Large', kind: 'onnx', url: 'models/mobilenet_v3_large.onnx', mb: 16.8 },
  { name: 'MobileNetV3-Small', kind: 'onnx', url: 'models/mobilenet_v3_small.onnx', mb: 6.1 },
  { name: 'EfficientNet-Lite0', kind: 'mediapipe', url: 'models/efficientnet_lite0_int8.tflite', mb: 4.1 },
];
const DEVICES = ['auto', 'cpu'];   // auto = GPU を試して駄目なら CPU

const $ = id => document.getElementById(id);
const video = $('video');
const view = $('view');
const vctx = view.getContext('2d');
const crop = document.createElement('canvas');            // 判定に使う 224x224 の中央切り抜き
crop.width = crop.height = SIZE;
const cctx = crop.getContext('2d', { willReadFrequently: true });
const input = new Float32Array(3 * SIZE * SIZE);

let modelIdx = 0, devIdx = 0;
let runner = null;            // { name, backend, run(canvas) -> Promise<churrosScore> }
let loadingModel = false;
let paused = false, busy = false;
let smooth = null;            // 表示用に平滑化したスコア
const times = [];             // 直近の推論時間(ms)
let frames = 0, fps = 0, fpsT = performance.now();

// ===== モデル読み込み =====
let visionLib = null, fileset = null;
async function loadVision() {
  if (!visionLib) {
    visionLib = await import(`https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@${MP_VER}/vision_bundle.mjs`);
    fileset = await visionLib.FilesetResolver.forVisionTasks(
      `https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@${MP_VER}/wasm`);
  }
  return visionLib;
}

async function createOnnx(m, dev) {
  ort.env.wasm.numThreads = self.crossOriginIsolated ? Math.min(4, navigator.hardwareConcurrency || 1) : 1;
  const tries = dev === 'auto' && navigator.gpu ? ['webgpu', 'wasm'] : ['wasm'];
  let session = null, backend = null, lastErr = null;
  for (const ep of tries) {
    try {
      const s = await ort.InferenceSession.create(m.url, { executionProviders: [ep] });
      await s.run({ image: new ort.Tensor('float32', input, [1, 3, SIZE, SIZE]) });  // 試し推論
      session = s; backend = ep; break;
    } catch (e) { lastErr = e; }
  }
  if (!session) throw lastErr;
  return {
    backend: backend === 'webgpu' ? 'GPU (WebGPU)' : 'CPU (wasm)',
    async run(src) {
      const px = cctx.getImageData(0, 0, SIZE, SIZE).data;
      const n = SIZE * SIZE;
      for (let i = 0; i < n; i++) {
        input[i] = px[i * 4] / 255;
        input[n + i] = px[i * 4 + 1] / 255;
        input[2 * n + i] = px[i * 4 + 2] / 255;
      }
      const out = await session.run({ image: new ort.Tensor('float32', input, [1, 3, SIZE, SIZE]) });
      return out.probs.data[LABELS.indexOf('churros')];
    },
    close() { session.release && session.release(); },
  };
}

async function createMediapipe(m, dev) {
  const { ImageClassifier } = await loadVision();
  const opts = delegate => ({ baseOptions: { modelAssetPath: m.url, delegate }, runningMode: 'VIDEO', maxResults: 2 });
  let clf = null, backend = 'CPU';
  if (dev === 'auto') {
    // 作成できても推論で失敗することがある（int8 モデル等）ので試し推論までして確認
    try {
      clf = await ImageClassifier.createFromOptions(fileset, opts('GPU'));
      clf.classifyForVideo(crop, performance.now());
      backend = 'GPU (WebGL)';
    } catch (_) { try { clf && clf.close(); } catch (_) {} clf = null; }
  }
  if (!clf) clf = await ImageClassifier.createFromOptions(fileset, opts('CPU'));
  return {
    backend,
    async run(src) {
      const r = clf.classifyForVideo(src, performance.now());
      const c = r.classifications[0].categories.find(x => x.categoryName === 'churros');
      return c ? c.score : 0;
    },
    close() { clf.close(); },
  };
}

async function loadModel() {
  loadingModel = true;
  const m = MODELS[modelIdx], dev = DEVICES[devIdx];
  $('modelBtn').textContent = `${m.name} 読み込み中…`;
  if (runner) { try { runner.close(); } catch (_) {} runner = null; }
  times.length = 0; smooth = null;
  const t0 = performance.now();
  try {
    const r = m.kind === 'onnx' ? await createOnnx(m, dev) : await createMediapipe(m, dev);
    r.name = m.name; r.mb = m.mb; r.loadMs = performance.now() - t0;
    runner = r;
    $('modelBtn').textContent = `${m.name} ▾`;
  } catch (e) {
    console.error(e);
    $('modelBtn').textContent = `${m.name} 読込失敗`;
  }
  loadingModel = false;
}
$('modelBtn').addEventListener('click', () => {
  if (loadingModel) return;
  modelIdx = (modelIdx + 1) % MODELS.length;
  loadModel();
});
$('devBtn').addEventListener('click', () => {
  if (loadingModel) return;
  devIdx = (devIdx + 1) % DEVICES.length;
  $('devBtn').textContent = '実行: ' + (DEVICES[devIdx] === 'auto' ? '自動' : 'CPUのみ');
  $('devBtn').classList.toggle('on', DEVICES[devIdx] === 'cpu');
  loadModel();
});

// ===== カメラ =====
let facing = 'environment', stream = null, mirror = false;
async function startCamera() {
  if (stream) stream.getTracks().forEach(t => t.stop());
  stream = await navigator.mediaDevices.getUserMedia({
    video: { facingMode: { ideal: facing }, width: { ideal: 1280 }, height: { ideal: 720 } }, audio: false });
  video.srcObject = stream;
  await video.play();
  const s = stream.getVideoTracks()[0].getSettings();
  mirror = s.facingMode ? s.facingMode === 'user' : (facing === 'user' || !/Android|iPhone|iPad/.test(navigator.userAgent));
}
$('flipBtn').addEventListener('click', async () => {
  facing = facing === 'environment' ? 'user' : 'environment';
  try { await startCamera(); } catch (_) {}
});
$('pauseBtn').addEventListener('click', () => {
  paused = !paused;
  $('pauseBtn').textContent = paused ? '再開' : '停止';
  paused ? video.pause() : video.play();
});

// ===== 判定しきい値 =====
const th = () => parseFloat($('th').value);
$('th').addEventListener('input', () => { $('thv').textContent = th().toFixed(2); $('thMark').style.left = th() * 100 + '%'; });
$('thMark').style.left = th() * 100 + '%';

// ===== 描画 =====
function resize() {
  const dpr = Math.min(devicePixelRatio || 1, 2);
  view.width = innerWidth * dpr; view.height = innerHeight * dpr;
}
addEventListener('resize', resize);
resize();

// 判定範囲：画面に見えている範囲に収まる中央の正方形（映像座標）
function cropRect(vw, vh) {
  const s = Math.max(view.width / vw, view.height / vh);       // object-fit: cover の倍率
  const side = Math.min(vw, vh, view.width / s, view.height / s) * 0.85;
  return { sx: (vw - side) / 2, sy: (vh - side) / 2, side };
}

function draw() {
  const W = view.width, H = view.height, vw = video.videoWidth, vh = video.videoHeight;
  if (!vw || !vh) return;
  const s = Math.max(W / vw, H / vh), dw = vw * s, dh = vh * s, ox = (W - dw) / 2, oy = (H - dh) / 2;
  vctx.save();
  if (mirror) { vctx.translate(W, 0); vctx.scale(-1, 1); }
  vctx.drawImage(video, ox, oy, dw, dh);
  vctx.restore();
  // 判定範囲の枠
  const { sx, sy, side } = cropRect(vw, vh);
  let x = ox + sx * s; const y = oy + sy * s, w = side * s;
  if (mirror) x = W - x - w;
  const yes = smooth != null && smooth >= th();
  vctx.save();
  vctx.fillStyle = 'rgba(0,0,0,.35)';
  vctx.fillRect(0, 0, W, Math.max(0, y)); vctx.fillRect(0, y + w, W, H - y - w);
  vctx.fillRect(0, y, Math.max(0, x), w); vctx.fillRect(x + w, y, W - x - w, w);
  vctx.lineWidth = 4 * Math.min(devicePixelRatio || 1, 2);
  vctx.strokeStyle = yes ? '#ffcf6e' : 'rgba(255,255,255,.8)';
  vctx.strokeRect(x, y, w, w);
  vctx.restore();
}

async function infer() {
  if (busy || paused || !runner || loadingModel || video.readyState < 2) return;
  busy = true;
  try {
    const { sx, sy, side } = cropRect(video.videoWidth, video.videoHeight);
    cctx.drawImage(video, sx, sy, side, side, 0, 0, SIZE, SIZE);
    const t0 = performance.now();
    const score = await runner.run(crop);
    times.push(performance.now() - t0); if (times.length > 30) times.shift();
    smooth = smooth == null ? score : smooth * 0.6 + score * 0.4;
    frames++;
    updateUI(score);
  } catch (e) { console.error(e); }
  busy = false;
}

function updateUI(raw) {
  const yes = smooth >= th();
  const v = $('verdict');
  v.textContent = yes ? 'チュロス！' : 'チュロスではない';
  v.className = yes ? 'yes' : 'no';
  $('scoreBar').style.width = (smooth * 100).toFixed(1) + '%';
  $('scoreNum').textContent = `チュロスらしさ ${(smooth * 100).toFixed(0)}%（瞬間値 ${(raw * 100).toFixed(0)}%）`;
}

function updateStats() {
  const now = performance.now();
  if (now - fpsT >= 1000) { fps = frames * 1000 / (now - fpsT); frames = 0; fpsT = now; }
  if (!runner) { $('stats').textContent = '読み込み中…'; return; }
  const avg = times.length ? times.reduce((a, b) => a + b, 0) / times.length : 0;
  const sorted = [...times].sort((a, b) => a - b);
  const p90 = sorted.length ? sorted[Math.floor(sorted.length * 0.9)] : 0;
  $('stats').textContent =
    `${runner.name} (${runner.mb}MB)\n` +
    `実行: ${runner.backend}\n` +
    `推論 平均 ${avg.toFixed(1)}ms / 遅い時 ${p90.toFixed(1)}ms\n` +
    `判定 ${fps.toFixed(1)}回/秒\n` +
    `読込 ${(runner.loadMs / 1000).toFixed(1)}秒  映像 ${video.videoWidth}x${video.videoHeight}`;
}

function loop() {
  draw();
  infer();
  updateStats();
  requestAnimationFrame(loop);
}

$('startBtn').addEventListener('click', async () => {
  $('startMsg').textContent = '起動中…';
  try {
    if (!navigator.mediaDevices?.getUserMedia) throw new Error('このブラウザ（または http 接続）ではカメラを使えません。https で開いてください。');
    await startCamera();
    $('start').style.display = 'none';
    for (const id of ['top', 'bottom']) $(id).style.display = 'flex';
    $('result').style.display = 'block';
    loadModel();
    loop();
  } catch (e) {
    $('startMsg').textContent = 'カメラを起動できませんでした：' + (e.message || e);
  }
});

// ===== 動作確認用（開発者ツールから呼ぶ）: 画像URLを現在のモデルで判定 =====
window.debugClassify = async (url) => {
  const img = new Image(); img.crossOrigin = 'anonymous'; img.src = url; await img.decode();
  const side = Math.min(img.width, img.height);
  cctx.drawImage(img, (img.width - side) / 2, (img.height - side) / 2, side, side, 0, 0, SIZE, SIZE);
  const t0 = performance.now(); const score = await runner.run(crop);
  return { model: runner.name, backend: runner.backend, score: +score.toFixed(4), ms: +(performance.now() - t0).toFixed(1) };
};
window.debugLoadModel = async (i, dev = 'auto') => { modelIdx = i; devIdx = DEVICES.indexOf(dev); await loadModel(); return runner && { name: runner.name, backend: runner.backend }; };
</script>
</body>
</html>
