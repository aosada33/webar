<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>ARカメラ サンプル</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; color: #fff; overflow: hidden;
    font-family: system-ui, -apple-system, "Hiragino Sans", sans-serif;
    -webkit-user-select: none; user-select: none; }
  /* video は解析用。表示は #bg キャンバスに描く */
  #video { position: absolute; left: 0; top: 0; width: 2px; height: 2px; opacity: 0; pointer-events: none; }
  #bg, #gl { position: absolute; inset: 0; width: 100%; height: 100%; }
  #gl { touch-action: none; }

  button { font: inherit; border: 0; cursor: pointer; color: #fff; }
  .chip { background: rgba(0,0,0,.5); padding: 8px 14px; border-radius: 999px; font-size: 14px; }
  .chip.on { background: #7fd4ff; color: #002233; }

  #top { position: absolute; top: 12px; left: 12px; right: 12px; display: none;
    justify-content: space-between; align-items: flex-start; gap: 8px; z-index: 10; pointer-events: none; }
  #top > * { pointer-events: auto; }
  #hint { font-size: 13px; line-height: 1.5; background: rgba(0,0,0,.45);
    padding: 6px 12px; border-radius: 12px; pointer-events: none !important; }
  #topBtns { display: flex; flex-direction: column; gap: 8px; align-items: flex-end; }

  #bottom { position: absolute; bottom: 28px; left: 0; right: 0; display: none;
    justify-content: space-around; align-items: center; z-index: 10; }
  .round { width: 54px; height: 54px; border-radius: 50%; background: rgba(0,0,0,.5);
    font-size: 24px; display: flex; align-items: center; justify-content: center; }
  #shutter { width: 74px; height: 74px; border-radius: 50%; background: #fff;
    box-shadow: 0 0 0 5px rgba(255,255,255,.4); }
  #shutter:active { transform: scale(.92); }
  #flash { position: absolute; inset: 0; background: #fff; opacity: 0;
    pointer-events: none; z-index: 15; }

  #start { position: absolute; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 16px; padding: 24px;
    text-align: center; line-height: 1.7; background: #111; z-index: 20; }
  .primary { background: #7fd4ff; color: #002233; font-weight: 700;
    padding: 14px 28px; border-radius: 999px; font-size: 17px; }
  .secondary { background: #333; padding: 12px 22px; border-radius: 999px; }

  #preview { position: absolute; inset: 0; background: rgba(0,0,0,.92); z-index: 30;
    display: none; flex-direction: column; align-items: center; justify-content: center;
    gap: 16px; padding: 16px; box-sizing: border-box; }
  #preview img { max-width: 100%; max-height: 70vh; border-radius: 8px; }
  #preview .row { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
</style>
<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }
</script>
</head>
<body>
<video id="video" playsinline muted autoplay></video>
<canvas id="bg"></canvas>
<canvas id="gl"></canvas>

<div id="top">
  <div id="hint">1本指：移動　ピンチ：拡大縮小<br>2本指でひねる：回転</div>
  <div id="topBtns">
    <button class="chip on" id="objBtn">3D表示 ON</button>
    <button class="chip" id="labelBtn">名前表示 OFF</button>
    <button class="chip" id="maskBtn">人を黒塗り OFF</button>
    <button class="chip on" id="tiltBtn">傾き追従 ON</button>
    <button class="chip" id="resetBtn">位置リセット</button>
  </div>
</div>

<div id="bottom">
  <button class="round" id="shapeBtn" aria-label="オブジェクト切替">◆</button>
  <button id="shutter" aria-label="撮影"></button>
  <button class="round" id="flipBtn" aria-label="カメラ切替">⟲</button>
</div>
<div id="flash"></div>

<div id="start">
  <div><b style="font-size:20px">ARカメラ サンプル</b></div>
  <div>カメラ映像の上に3Dオブジェクトを置いて<br>写真を撮れます。マーカーは不要です。</div>
  <button class="primary" id="startBtn">カメラを起動</button>
  <div id="startMsg" style="color:#ffb37f"></div>
</div>

<div id="preview">
  <img id="photo" alt="撮影した写真">
  <div class="row">
    <button class="primary" id="saveBtn">保存</button>
    <button class="secondary" id="shareBtn" style="display:none">共有</button>
    <button class="secondary" id="closeBtn">閉じる</button>
  </div>
</div>

<script type="module">
import * as THREE from 'three';

const $ = id => document.getElementById(id);
const video = $('video');
const bg = $('bg');
const bgCtx = bg.getContext('2d');
const canvas = $('gl');

// ===== three.js =====
const renderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 2));
renderer.outputColorSpace = THREE.SRGBColorSpace;

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(60, 1, 0.1, 100);

scene.add(new THREE.HemisphereLight(0xffffff, 0x445566, 2.2));
const dir = new THREE.DirectionalLight(0xffffff, 1.6);
dir.position.set(2, 3, 4);
scene.add(dir);

const holder = new THREE.Group();
scene.add(holder);

const shapes = [
  () => new THREE.Mesh(new THREE.TorusKnotGeometry(0.5, 0.17, 160, 20),
        new THREE.MeshStandardMaterial({ color: 0xff7aa8, roughness: 0.35, metalness: 0.2 })),
  () => new THREE.Mesh(new THREE.BoxGeometry(0.9, 0.9, 0.9),
        new THREE.MeshStandardMaterial({ color: 0xffd36e, roughness: 0.4 })),
  () => new THREE.Mesh(new THREE.TorusGeometry(0.5, 0.2, 32, 64),
        new THREE.MeshStandardMaterial({ color: 0x7fd4ff, roughness: 0.25, metalness: 0.3 })),
  () => new THREE.Mesh(new THREE.IcosahedronGeometry(0.6, 0),
        new THREE.MeshStandardMaterial({ color: 0x9cf28a, roughness: 0.5, flatShading: true })),
];
let shapeIndex = 0;
let current = null;
function setShape(i) {
  if (current) { holder.remove(current); current.geometry.dispose(); current.material.dispose(); }
  current = shapes[i]();
  holder.add(current);
}
setShape(0);

const DIST = 4;
function resetObject() {
  holder.position.copy(new THREE.Vector3(0, 0, -DIST).applyQuaternion(camera.quaternion));
  holder.scale.setScalar(1);
  holder.rotation.set(0.3, 0, 0);
}

function resize() {
  const w = innerWidth, h = innerHeight;
  renderer.setSize(w, h, false);
  bg.width = canvas.width; bg.height = canvas.height;   // 3Dと同じ解像度
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
}
addEventListener('resize', resize);
resize();

// ===== 傾き追従 =====
let tiltOn = true;
let baseQ = null, deviceQ = null;
const zee = new THREE.Vector3(0, 0, 1);
const euler = new THREE.Euler();
const q0 = new THREE.Quaternion();
const q1 = new THREE.Quaternion(-Math.sqrt(0.5), 0, 0, Math.sqrt(0.5));

function onOrientation(e) {
  if (e.alpha == null) return;
  const d = THREE.MathUtils.degToRad;
  const orient = d((screen.orientation && screen.orientation.angle) || window.orientation || 0);
  const q = new THREE.Quaternion();
  euler.set(d(e.beta), d(e.alpha), -d(e.gamma), 'YXZ');
  q.setFromEuler(euler);
  q.multiply(q1);
  q.multiply(q0.setFromAxisAngle(zee, -orient));
  deviceQ = q;
  if (!baseQ) baseQ = q.clone();
}
async function enableOrientation() {
  try {
    if (typeof DeviceOrientationEvent !== 'undefined' &&
        typeof DeviceOrientationEvent.requestPermission === 'function') {
      const r = await DeviceOrientationEvent.requestPermission(); // iPhone用
      if (r !== 'granted') throw new Error('denied');
    }
    addEventListener('deviceorientation', onOrientation);
  } catch (_) { tiltOn = false; updateTiltBtn(); }
}
function updateCameraFromDevice() {
  if (tiltOn && deviceQ && baseQ) camera.quaternion.copy(baseQ.clone().invert().multiply(deviceQ));
  else camera.quaternion.identity();
}
function updateTiltBtn() {
  const b = $('tiltBtn');
  b.textContent = '傾き追従 ' + (tiltOn ? 'ON' : 'OFF');
  b.classList.toggle('on', tiltOn);
}
$('tiltBtn').addEventListener('click', () => {
  tiltOn = !tiltOn;
  baseQ = deviceQ ? deviceQ.clone() : null;
  updateCameraFromDevice(); resetObject(); updateTiltBtn();
});
$('resetBtn').addEventListener('click', () => {
  baseQ = deviceQ ? deviceQ.clone() : null;
  updateCameraFromDevice(); resetObject();
});

// ===== タッチ操作 =====
const pointers = new Map();
let gesture = null;
function camAxes() {
  return {
    right: new THREE.Vector3(1, 0, 0).applyQuaternion(camera.quaternion),
    up: new THREE.Vector3(0, 1, 0).applyQuaternion(camera.quaternion)
  };
}
function unitsPerPixel() {
  const dist = holder.position.distanceTo(camera.position);
  return 2 * Math.tan(THREE.MathUtils.degToRad(camera.fov / 2)) * dist / innerHeight;
}
canvas.addEventListener('pointerdown', e => {
  if (!holder.visible) return;   // 非表示中は操作しない
  canvas.setPointerCapture(e.pointerId);
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  gesture = null;
});
canvas.addEventListener('pointermove', e => {
  if (!pointers.has(e.pointerId)) return;
  const prev = pointers.get(e.pointerId);
  const cur = { x: e.clientX, y: e.clientY };
  if (pointers.size === 1) {
    const k = unitsPerPixel();
    const { right, up } = camAxes();
    holder.position.addScaledVector(right, (cur.x - prev.x) * k);
    holder.position.addScaledVector(up, -(cur.y - prev.y) * k);
    pointers.set(e.pointerId, cur);
  } else if (pointers.size === 2) {
    pointers.set(e.pointerId, cur);
    const [a, b] = [...pointers.values()];
    const dist = Math.hypot(b.x - a.x, b.y - a.y);
    const ang = Math.atan2(b.y - a.y, b.x - a.x);
    if (gesture) {
      holder.scale.setScalar(THREE.MathUtils.clamp(holder.scale.x * dist / gesture.dist, 0.2, 5));
      let dA = ang - gesture.ang;
      if (dA > Math.PI) dA -= 2 * Math.PI;
      if (dA < -Math.PI) dA += 2 * Math.PI;
      holder.rotateY(dA * 1.5);
    }
    gesture = { dist, ang };
  }
});
const endPointer = e => { pointers.delete(e.pointerId); gesture = null; };
canvas.addEventListener('pointerup', endPointer);
canvas.addEventListener('pointercancel', endPointer);
canvas.addEventListener('wheel', e => {
  e.preventDefault();
  holder.scale.setScalar(THREE.MathUtils.clamp(holder.scale.x * (e.deltaY < 0 ? 1.1 : 0.9), 0.2, 5));
}, { passive: false });

$('shapeBtn').addEventListener('click', () => {
  shapeIndex = (shapeIndex + 1) % shapes.length;
  setShape(shapeIndex);
  if (!holder.visible) toggleObject();   // 形を選んだら表示に戻す
});

// 3Dオブジェクトの表示 ON/OFF
function toggleObject() {
  holder.visible = !holder.visible;
  const b = $('objBtn');
  b.textContent = '3D表示 ' + (holder.visible ? 'ON' : 'OFF');
  b.classList.toggle('on', holder.visible);
  $('hint').style.display = holder.visible ? '' : 'none';
}
$('objBtn').addEventListener('click', toggleObject);

// ===== 人の黒塗り（MediaPipe 人物セグメンテーション） =====
const MP_VER = '0.10.14';
let segmenter = null, segLoading = false;
let maskOn = false;
const small = document.createElement('canvas');      // 解析用の縮小フレーム
const smallCtx = small.getContext('2d', { willReadFrequently: true });
const maskCanvas = document.createElement('canvas'); // 黒塗りマスク
const maskCtx = maskCanvas.getContext('2d');
let maskReady = false;
let lastVideoTime = -1;

// MediaPipe 本体の読み込み（黒塗り・名前表示で共用）
let visionLib = null, fileset = null;
async function loadVision() {
  if (!visionLib) {
    visionLib = await import(`https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@${MP_VER}/vision_bundle.mjs`);
    fileset = await visionLib.FilesetResolver.forVisionTasks(
      `https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@${MP_VER}/wasm`);
  }
  return { ...visionLib, fileset };
}

async function loadSegmenter() {
  segLoading = true;
  const { ImageSegmenter } = await loadVision();
  const opts = delegate => ({
    baseOptions: {
      modelAssetPath: 'https://storage.googleapis.com/mediapipe-models/image_segmenter/selfie_segmenter/float16/latest/selfie_segmenter.tflite',
      delegate
    },
    runningMode: 'VIDEO',
    outputCategoryMask: false,
    outputConfidenceMasks: true
  });
  try { segmenter = await ImageSegmenter.createFromOptions(fileset, opts('GPU')); }
  catch (_) { segmenter = await ImageSegmenter.createFromOptions(fileset, opts('CPU')); }
  segLoading = false;
}

function updateMaskBtn(text) {
  const b = $('maskBtn');
  b.textContent = text || ('人を黒塗り ' + (maskOn ? 'ON' : 'OFF'));
  b.classList.toggle('on', maskOn);
}
$('maskBtn').addEventListener('click', async () => {
  if (segLoading) return;
  if (!segmenter) {
    updateMaskBtn('読み込み中…');
    try { await loadSegmenter(); }
    catch (e) { segLoading = false; updateMaskBtn('黒塗り 読込失敗'); return; }
  }
  maskOn = !maskOn;
  maskReady = false;
  updateMaskBtn();
});

function segmentFrame() {
  if (!segmenter || video.readyState < 2 || video.currentTime === lastVideoTime) return;
  lastVideoTime = video.currentTime;
  const vw = video.videoWidth, vh = video.videoHeight;
  const sw = 256, sh = Math.round(256 * vh / vw);
  if (small.width !== sw || small.height !== sh) { small.width = sw; small.height = sh; }
  smallCtx.drawImage(video, 0, 0, sw, sh);

  segmenter.segmentForVideo(small, performance.now(), result => {
    const m = result.confidenceMasks && result.confidenceMasks[0];
    if (!m) return;
    const w = m.width, h = m.height, conf = m.getAsFloat32Array();
    if (maskCanvas.width !== w || maskCanvas.height !== h) { maskCanvas.width = w; maskCanvas.height = h; }
    const img = maskCtx.createImageData(w, h);
    const d = img.data;
    for (let i = 0; i < conf.length; i++) {
      // 少し低めのしきい値で、人の輪郭まで確実に覆う
      d[i * 4 + 3] = conf[i] > 0.25 ? 255 : 0;   // RGB は 0（黒）
    }
    maskCtx.putImageData(img, 0, 0);
    maskReady = true;
  });
}

// ===== 名前表示（MediaPipe 物体検出 / COCO 80種類） =====
const JA = {
  'person': '人', 'laptop': 'ノートPC', 'tv': 'モニター', 'keyboard': 'キーボード',
  'mouse': 'マウス', 'chair': '椅子', 'dining table': '机', 'cell phone': 'スマホ',
  'cup': 'カップ', 'bottle': 'ボトル', 'book': '本', 'potted plant': '観葉植物',
  'couch': 'ソファ', 'clock': '時計', 'backpack': 'リュック', 'handbag': 'バッグ',
  'remote': 'リモコン', 'scissors': 'はさみ', 'umbrella': '傘', 'refrigerator': '冷蔵庫',
  'microwave': '電子レンジ', 'sink': 'シンク', 'vase': '花瓶', 'tie': 'ネクタイ',
  'wine glass': 'グラス', 'bowl': 'ボウル', 'suitcase': 'スーツケース', 'bench': 'ベンチ',
  'oven': 'オーブン', 'toaster': 'トースター', 'bed': 'ベッド', 'teddy bear': 'ぬいぐるみ'
};
let detector = null, detLoading = false, labelOn = false;
let detections = [], detFrameW = 1, detFrameH = 1, lastDetAt = 0;
const detCanvas = document.createElement('canvas');
const detCtx = detCanvas.getContext('2d');

async function loadDetector() {
  detLoading = true;
  const { ObjectDetector } = await loadVision();
  const opts = delegate => ({
    baseOptions: {
      modelAssetPath: 'https://storage.googleapis.com/mediapipe-models/object_detector/efficientdet_lite0/float16/1/efficientdet_lite0.tflite',
      delegate
    },
    runningMode: 'VIDEO',
    scoreThreshold: 0.35,
    maxResults: 15
  });
  try { detector = await ObjectDetector.createFromOptions(fileset, opts('GPU')); }
  catch (_) { detector = await ObjectDetector.createFromOptions(fileset, opts('CPU')); }
  detLoading = false;
}

function updateLabelBtn(text) {
  const b = $('labelBtn');
  b.textContent = text || ('名前表示 ' + (labelOn ? 'ON' : 'OFF'));
  b.classList.toggle('on', labelOn);
}
$('labelBtn').addEventListener('click', async () => {
  if (detLoading) return;
  if (!detector) {
    updateLabelBtn('読み込み中…');
    try { await loadDetector(); }
    catch (e) { detLoading = false; updateLabelBtn('名前表示 読込失敗'); return; }
  }
  labelOn = !labelOn;
  detections = [];
  updateLabelBtn();
});

function detectFrame() {
  const now = performance.now();
  if (!detector || video.readyState < 2 || now - lastDetAt < 150) return; // 約7回/秒
  lastDetAt = now;
  const vw = video.videoWidth, vh = video.videoHeight;
  const dw = 480, dh = Math.round(480 * vh / vw);
  if (detCanvas.width !== dw || detCanvas.height !== dh) { detCanvas.width = dw; detCanvas.height = dh; }
  detCtx.drawImage(video, 0, 0, dw, dh);
  const res = detector.detectForVideo(detCanvas, now);
  detections = res.detections || [];
  detFrameW = dw; detFrameH = dh;
}

function drawLabels(ctx, W, H) {
  const s = Math.max(W / detFrameW, H / detFrameH);
  const ox = (W - detFrameW * s) / 2, oy = (H - detFrameH * s) / 2;
  const scale = Math.min(devicePixelRatio || 1, 2);
  const fs = Math.round(15 * scale);
  ctx.save();
  ctx.lineWidth = 3 * scale;
  ctx.font = `bold ${fs}px system-ui, "Hiragino Sans", sans-serif`;
  ctx.textBaseline = 'top';
  for (const d of detections) {
    const b = d.boundingBox, c = d.categories[0];
    if (!b || !c) continue;
    let x = ox + b.originX * s;
    const y = oy + b.originY * s, w = b.width * s, h = b.height * s;
    if (mirror) x = W - x - w;
    ctx.strokeStyle = '#7fd4ff';
    ctx.strokeRect(x, y, w, h);
    const label = `${JA[c.categoryName] || c.categoryName} ${Math.round(c.score * 100)}%`;
    const tw = ctx.measureText(label).width + 12 * scale;
    const th = fs + 8 * scale;
    const ty = y - th < 0 ? y : y - th;
    ctx.fillStyle = '#7fd4ff';
    ctx.fillRect(x - ctx.lineWidth / 2, ty, tw, th);
    ctx.fillStyle = '#002233';
    ctx.fillText(label, x + 6 * scale - ctx.lineWidth / 2, ty + 4 * scale);
  }
  ctx.restore();
}

// ===== カメラ =====
let facing = 'environment';
let stream = null;
let mirror = false;

async function startCamera() {
  if (stream) stream.getTracks().forEach(t => t.stop());
  stream = await navigator.mediaDevices.getUserMedia({
    video: { facingMode: { ideal: facing }, width: { ideal: 1280 }, height: { ideal: 720 } },
    audio: false
  });
  video.srcObject = stream;
  await video.play();
  const s = stream.getVideoTracks()[0].getSettings();
  mirror = s.facingMode ? s.facingMode === 'user'
                        : (facing === 'user' || !/Android|iPhone|iPad/.test(navigator.userAgent));
  lastVideoTime = -1;
  maskReady = false;
}
$('flipBtn').addEventListener('click', async () => {
  facing = facing === 'environment' ? 'user' : 'environment';
  try { await startCamera(); } catch (_) {}
});

// object-fit: cover と同じ切り抜きで描画（鏡像にも対応）
function drawCover(ctx, src, sw, sh, W, H) {
  const s = Math.max(W / sw, H / sh);
  const dw = sw * s, dh = sh * s;
  ctx.save();
  if (mirror) { ctx.translate(W, 0); ctx.scale(-1, 1); }
  ctx.drawImage(src, (W - dw) / 2, (H - dh) / 2, dw, dh);
  ctx.restore();
}

function drawBackground() {
  const W = bg.width, H = bg.height;
  const vw = video.videoWidth, vh = video.videoHeight;
  if (!vw || !vh) return;
  drawCover(bgCtx, video, vw, vh, W, H);
  if (maskOn) {
    segmentFrame();
    if (maskReady) {
      bgCtx.imageSmoothingEnabled = true;
      drawCover(bgCtx, maskCanvas, maskCanvas.width, maskCanvas.height, W, H);
    }
  }
  if (labelOn) {
    detectFrame();
    drawLabels(bgCtx, W, H);
  }
}

$('startBtn').addEventListener('click', async () => {
  $('startMsg').textContent = '起動中…';
  try {
    await enableOrientation();
    await startCamera();
    $('start').style.display = 'none';
    $('top').style.display = 'flex';
    $('bottom').style.display = 'flex';
    updateTiltBtn();
    setTimeout(() => { baseQ = deviceQ ? deviceQ.clone() : null; updateCameraFromDevice(); resetObject(); }, 300);
    resetObject();
    renderer.setAnimationLoop(() => {
      drawBackground();
      updateCameraFromDevice();
      renderer.render(scene, camera);
    });
  } catch (e) {
    $('startMsg').textContent = 'カメラを起動できませんでした：' + (e.message || e);
  }
});

// ===== 撮影：画面に見えている背景（黒塗り込み）+ 3D を合成 =====
let lastBlob = null;
function capture() {
  const W = canvas.width, H = canvas.height;
  const out = document.createElement('canvas');
  out.width = W; out.height = H;
  const ctx = out.getContext('2d');
  drawBackground();
  ctx.drawImage(bg, 0, 0, W, H);
  renderer.render(scene, camera);
  ctx.drawImage(canvas, 0, 0, W, H);
  return new Promise(res => out.toBlob(res, 'image/jpeg', 0.92));
}

$('shutter').addEventListener('click', async () => {
  const flash = $('flash');
  flash.style.transition = 'none'; flash.style.opacity = '0.85';
  requestAnimationFrame(() => { flash.style.transition = 'opacity .3s'; flash.style.opacity = '0'; });
  lastBlob = await capture();
  $('photo').src = URL.createObjectURL(lastBlob);
  const file = new File([lastBlob], 'ar-photo.jpg', { type: 'image/jpeg' });
  $('shareBtn').style.display =
    (navigator.canShare && navigator.canShare({ files: [file] })) ? 'inline-block' : 'none';
  $('preview').style.display = 'flex';
});
$('saveBtn').addEventListener('click', () => {
  if (!lastBlob) return;
  const d = new Date(), p = n => String(n).padStart(2, '0');
  const a = document.createElement('a');
  a.download = `ar-photo_${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}.jpg`;
  a.href = URL.createObjectURL(lastBlob);
  a.click();
});
$('shareBtn').addEventListener('click', async () => {
  if (!lastBlob) return;
  try { await navigator.share({ files: [new File([lastBlob], 'ar-photo.jpg', { type: 'image/jpeg' })] }); }
  catch (_) {}
});
$('closeBtn').addEventListener('click', () => { $('preview').style.display = 'none'; });
</script>
</body>
</html>
