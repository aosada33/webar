<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>WebAR サンプル</title>
<style>
  html, body { margin: 0; height: 100%; background: #111; color: #eee;
    font-family: system-ui, -apple-system, "Hiragino Sans", sans-serif; overflow: hidden; }
  #info { position: absolute; top: 0; left: 0; right: 0; padding: 16px;
    text-align: center; font-size: 15px; line-height: 1.6; z-index: 10; pointer-events: none; }
  #info b { color: #7fd4ff; }
  #msg { margin-top: 8px; color: #ffb37f; }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
</head>
<body>
<div id="info">
  <b>WebAR サンプル</b><br>
  下の「START AR」を押し、カメラで床を映してください。<br>
  リングが表示されたらタップで立方体を配置します。
  <div id="msg"></div>
</div>

<script type="module">
import * as THREE from 'three';
import { ARButton } from 'three/addons/webxr/ARButton.js';

const msg = document.getElementById('msg');

// --- 基本セットアップ ---
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(70, innerWidth / innerHeight, 0.01, 20);

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(devicePixelRatio);
renderer.setSize(innerWidth, innerHeight);
renderer.xr.enabled = true;
document.body.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xffffff, 0x444444, 2));
const dir = new THREE.DirectionalLight(0xffffff, 1.5);
dir.position.set(1, 3, 2);
scene.add(dir);

// --- 対応チェック ---
if (!('xr' in navigator)) {
  msg.textContent = 'このブラウザはWebXRに非対応です（Android版Chrome推奨）。';
} else {
  navigator.xr.isSessionSupported('immersive-ar').then(ok => {
    if (!ok) msg.textContent = 'この端末はARセッションに非対応です（ARCore対応のAndroid端末が必要）。';
  });
}

// ARボタン（hit-test = 現実の平面検出 を要求）
document.body.appendChild(ARButton.createButton(renderer, {
  requiredFeatures: ['hit-test'],
  optionalFeatures: ['dom-overlay'],
  domOverlay: { root: document.getElementById('info') }
}));

// --- 照準リング（床の検出位置を示す） ---
const reticle = new THREE.Mesh(
  new THREE.RingGeometry(0.08, 0.1, 32).rotateX(-Math.PI / 2),
  new THREE.MeshBasicMaterial({ color: 0x7fd4ff })
);
reticle.matrixAutoUpdate = false;
reticle.visible = false;
scene.add(reticle);

// --- タップで立方体を配置 ---
const boxGeo = new THREE.BoxGeometry(0.1, 0.1, 0.1).translate(0, 0.05, 0);
const controller = renderer.xr.getController(0);
controller.addEventListener('select', () => {
  if (!reticle.visible) return;
  const mat = new THREE.MeshStandardMaterial({
    color: new THREE.Color().setHSL(Math.random(), 0.7, 0.55)
  });
  const box = new THREE.Mesh(boxGeo, mat);
  reticle.matrix.decompose(box.position, box.quaternion, box.scale);
  scene.add(box);
});
scene.add(controller);

// --- 状態表示（原因の切り分け用） ---
const setStatus = t => { msg.textContent = t; };

// --- hit-test ---
let hitTestSource = null;
let hitTestRequested = false;
let everHit = false;

renderer.xr.addEventListener('sessionstart', () => setStatus('AR開始：床の検出を準備中…'));

renderer.setAnimationLoop((time, frame) => {
  if (frame) {
    const refSpace = renderer.xr.getReferenceSpace();
    const session = renderer.xr.getSession();

    if (!hitTestRequested) {
      hitTestRequested = true;
      session.requestReferenceSpace('viewer').then(viewerSpace => {
        // 平面だけでなく特徴点も対象にして、検出されやすくする
        const opts = { space: viewerSpace, entityTypes: ['plane', 'point'] };
        return session.requestHitTestSource(opts)
          .catch(() => session.requestHitTestSource({ space: viewerSpace }));
      }).then(src => {
        hitTestSource = src;
        setStatus('床を探しています…スマホをゆっくり左右に動かしてください');
      }).catch(err => {
        setStatus('hit-testの開始に失敗：' + err.message);
      });
      session.addEventListener('end', () => {
        hitTestRequested = false; hitTestSource = null; everHit = false;
        setStatus('');
      });
    }

    if (hitTestSource) {
      const hits = frame.getHitTestResults(hitTestSource);
      const pose = hits.length ? hits[0].getPose(refSpace) : null;
      if (pose) {
        reticle.visible = true;
        reticle.matrix.fromArray(pose.transform.matrix);
        if (!everHit) { everHit = true; setStatus('床を検出しました。タップで配置できます'); }
      } else {
        reticle.visible = false;
      }
    }
  }
  renderer.render(scene, camera);
});

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
